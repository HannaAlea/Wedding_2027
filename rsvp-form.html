<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RSVP for Hanna & Nathaniel's wedding on 30 July 2027 in Ålesund, Norway.">
  <title>RSVP | Hanna & Nathaniel</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/appletouchicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/images/androidchrome192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/images/androidchrome512x512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="rsvp-body">
<main class="rsvp-page">
  <a class="back-link" href="index.html"> &lt; Back to home</a>

  <section class="rsvp-panel">
    <div class="rsvp-intro">
      <p class="eyebrow">Hanna & Nathaniel</p>
      <h1>RSVP</h1>
      <p>Please let us know if you will be celebrating with us.</p>
    </div>

    <form class="rsvp-form" id="rsvpForm" action="https://formspree.io/f/mbglgoqr" method="POST">
      <input type="hidden" name="_subject" value="New wedding RSVP submission">

      <p class="hidden-field">
        <label>Don't fill this out: <input name="_gotcha"></label>
      </p>

      <div class="field-grid">
        <label>
          <span>Full name</span>
          <input type="text" name="name" placeholder="Your full name" required>
        </label>

        <label>
          <span>Email</span>
          <input type="email" name="email" placeholder="you@example.com" required>
        </label>
      </div>

      <div class="field-grid">
        <label>
          <span>Will you attend?</span>
          <select name="attendance" required>
            <option value="">Choose one</option>
            <option value="Yes, happily attending">Yes, happily attending</option>
            <option value="Sorry, cannot attend">Sorry, cannot attend</option>
          </select>
        </label>
      </div>

      <label>
        <span>Dietary notes</span>
        <input type="text" name="dietary" placeholder="Allergies or dietary restrictions">
      </label>

      <label>
        <span>Message for the couple</span>
        <textarea name="message" rows="5" placeholder="Write a short message"></textarea>
      </label>

      <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>

      <button class="button primary full-width" type="submit">Submit RSVP</button>
    </form>

    <div class="rsvp-success" id="rsvpSuccess" hidden>
      <p class="eyebrow">Hanna & Nathaniel</p>
      <h2>Thank you!</h2>
      <p>Your RSVP has been received &mdash; we can't wait to celebrate with you.</p>
    </div>
  </section>
</main>

<script src="assets/js/script.js"></script>
</body>
</html>
