<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RSVP for Hanna & Nathaniel's wedding on 30 July 2027 in Ålesund, Norway.">
  <title>RSVP | Hanna & Nathaniel</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/images/android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/images/android-chrome-512x512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="rsvp-body">
<main class="rsvp-page">
  <a class="back-link" id="backLink" href="index.html">
    <svg class="back-link-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M15 18l-6-6 6-6"/>
    </svg>
    <span>Back</span>
  </a>

  <section class="rsvp-panel" aria-labelledby="rsvpTitle">
    <header class="rsvp-intro">
      <p class="eyebrow">Hanna &amp; Nathaniel</p>
      <h1 id="rsvpTitle">RSVP</h1>
      <p>Please let us know if you will be celebrating with us on 30 July 2027 in Ålesund.</p>
    </header>

    <form class="rsvp-form" id="rsvpForm" action="https://formspree.io/f/mbglgoqr" method="POST">
      <input type="hidden" name="_subject" value="New wedding RSVP submission">

      <p class="hidden-field" aria-hidden="true">
        <label>Don't fill this out: <input name="_gotcha" tabindex="-1" autocomplete="off"></label>
      </p>

      <div class="field-grid">
        <label class="field">
          <span class="field-label">Full name</span>
          <input type="text" name="name" autocomplete="name" required>
        </label>

        <label class="field">
          <span class="field-label">Email</span>
          <input type="email" name="email" autocomplete="email" required>
        </label>
      </div>

      <fieldset class="attendance">
        <legend class="field-label">Will you attend?</legend>
        <div class="choice-grid">
          <label class="choice">
            <input type="radio" name="attendance" id="attendYes" value="Yes, happily attending" required>
            <span class="choice-title">Yes, I'll be there</span>
          </label>

          <label class="choice">
            <input type="radio" name="attendance" id="attendNo" value="Sorry, cannot attend">
            <span class="choice-title">No, I can't make it</span>
          </label>
        </div>
      </fieldset>

      <label class="field attending-only">
        <span class="field-label">Dietary notes <small>(optional)</small></span>
        <input type="text" name="dietary" placeholder="Allergies or dietary restrictions">
      </label>

      <label class="field">
        <span class="field-label">Message for the couple <small>(optional)</small></span>
        <textarea name="message" rows="4" placeholder="Write a short message"></textarea>
      </label>

      <div class="form-actions">
        <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
        <button class="button primary full-width" type="submit">Send RSVP</button>
      </div>
    </form>

    <div class="rsvp-success" id="rsvpSuccess" hidden>
      <p class="eyebrow">Hanna &amp; Nathaniel</p>
      <h2 id="successTitle" tabindex="-1">Thank you!</h2>
      <p id="successMessage">Your RSVP has been received.</p>
      <a class="button secondary" href="index.html">Explore the website</a>
    </div>
  </section>
</main>

<script src="assets/js/script.js"></script>
</body>
</html>
